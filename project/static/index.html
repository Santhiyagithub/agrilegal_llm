<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriLegal FPO Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #111b21; height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header {
    background: #202c33;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #2a3942;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #25d366, #128c7e);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .header-info { flex: 1; }
  .header-name { color: #e9edef; font-size: 15px; font-weight: 600; }
  .header-status { color: #8696a0; font-size: 12px; }
  .lang-select {
    background: #2a3942; border: none; color: #e9edef;
    padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }

  /* Chat area */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 16px;
    background: #0b141a;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 3px; }

  /* Messages */
  .msg-wrapper { display: flex; margin-bottom: 4px; }
  .msg-wrapper.user { justify-content: flex-end; }
  .msg-wrapper.bot { justify-content: flex-start; }

  .bubble {
    max-width: 72%; padding: 8px 12px 6px;
    border-radius: 8px; font-size: 14px; line-height: 1.5;
    position: relative; word-wrap: break-word;
  }
  .bubble.user { background: #005c4b; color: #e9edef; border-top-right-radius: 2px; }
  .bubble.bot { background: #202c33; color: #e9edef; border-top-left-radius: 2px; }

  .timestamp {
    font-size: 10px; color: #8696a0;
    text-align: right; margin-top: 3px;
  }
  .bubble.user .timestamp { color: #8696a0; }

  /* Legal formatted response */
  .legal-section { margin: 6px 0; }
  .legal-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 3px;
  }
  .label-provision { color: #25d366; }
  .label-penalty { color: #ff6b6b; }
  .label-action { color: #ffd93d; }
  .label-source { color: #6bcfff; }
  .legal-content { font-size: 13px; color: #d1d7db; }
  .action-item { padding: 2px 0; }
  .action-item::before { content: "✓ "; color: #25d366; }
  .divider { border: none; border-top: 1px solid #2a3942; margin: 8px 0; }

  /* Typing indicator */
  .typing-bubble {
    background: #202c33; border-radius: 8px; border-top-left-radius: 2px;
    padding: 12px 16px; display: inline-flex; gap: 4px; align-items: center;
  }
  .dot {
    width: 8px; height: 8px; background: #8696a0; border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Input area */
  .input-area {
    background: #202c33;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid #2a3942;
  }
  .text-input {
    flex: 1; background: #2a3942; border: none; border-radius: 8px;
    padding: 10px 14px; color: #e9edef; font-size: 14px; outline: none;
    resize: none; max-height: 120px; overflow-y: auto;
  }
  .text-input::placeholder { color: #8696a0; }

  .btn {
    width: 42px; height: 42px; border: none; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: background 0.2s; flex-shrink: 0;
  }
  .btn-mic { background: #2a3942; color: #8696a0; }
  .btn-mic:hover { background: #3b4a54; }
  .btn-mic.recording { background: #ff4444; color: white; animation: pulse 1s infinite; }
  .btn-send { background: #00a884; color: white; }
  .btn-send:hover { background: #008069; }
  .btn-send:disabled { background: #2a3942; color: #8696a0; cursor: not-allowed; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

  /* System message */
  .sys-msg {
    text-align: center; color: #8696a0; font-size: 12px;
    background: #182229; border-radius: 8px; padding: 6px 14px;
    margin: 8px auto; max-width: 80%;
  }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">⚖️</div>
  <div class="header-info">
    <div class="header-name">AgriLegal FPO Assistant</div>
    <div class="header-status" id="status-text">Connecting...</div>
  </div>
  <select class="lang-select" id="lang-select">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="ta">Tamil</option>
    <option value="te">Telugu</option>
  </select>
</div>

<div class="chat-area" id="chat-area">
  <div class="sys-msg">🔒 AgriLegal Assistant — Powered by local AI. Your queries never leave this device.</div>
</div>

<div class="input-area">
  <button class="btn btn-mic" id="mic-btn" title="Hold to record voice note">🎤</button>
  <textarea class="text-input" id="text-input" placeholder="Ask a legal compliance question..." rows="1"></textarea>
  <button class="btn btn-send" id="send-btn">➤</button>
</div>

<script>
const chatArea = document.getElementById('chat-area');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const statusText = document.getElementById('status-text');

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

// Check server status
async function checkStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    if (data.ollama === 'online') {
      statusText.textContent = `Online · ${data.pdf_count} legal doc(s) loaded`;
      statusText.style.color = '#25d366';
    } else {
      statusText.textContent = 'Ollama offline — run: ollama serve';
      statusText.style.color = '#ff6b6b';
    }
  } catch {
    statusText.textContent = 'Server unreachable';
    statusText.style.color = '#ff6b6b';
  }
}
checkStatus();
setInterval(checkStatus, 30000);

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMessage(text, type, isLegal=false, legalData=null) {
  const wrapper = document.createElement('div');
  wrapper.className = `msg-wrapper ${type}`;

  const bubble = document.createElement('div');
  bubble.className = `bubble ${type}`;

  if (isLegal && legalData) {
    bubble.innerHTML = formatLegalResponse(legalData);
  } else {
    bubble.textContent = text;
  }

  const ts = document.createElement('div');
  ts.className = 'timestamp';
  ts.textContent = getTime();
  bubble.appendChild(ts);

  wrapper.appendChild(bubble);
  chatArea.appendChild(wrapper);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function formatLegalResponse(data) {
  let html = '';
  if (data.provision) {
    html += `<div class="legal-section"><div class="legal-label label-provision">📜 Legal Provision</div><div class="legal-content">${data.provision}</div></div><hr class="divider">`;
  }
  if (data.penalty) {
    html += `<div class="legal-section"><div class="legal-label label-penalty">⚠️ Penalty</div><div class="legal-content">${data.penalty}</div></div><hr class="divider">`;
  }
  if (data.action) {
    const steps = data.action.split('\n').filter(s => s.trim());
    const stepsHtml = steps.map(s => `<div class="action-item">${s.replace(/^[\d\.\-\*]+\s*/, '')}</div>`).join('');
    html += `<div class="legal-section"><div class="legal-label label-action">✅ Action Checklist</div><div class="legal-content">${stepsHtml}</div></div><hr class="divider">`;
  }
  if (data.source) {
    html += `<div class="legal-section"><div class="legal-label label-source">📚 Source</div><div class="legal-content">${data.source}</div></div>`;
  }
  if (!html && data.raw) {
    html = `<div class="legal-content">${data.raw}</div>`;
  }
  return html || '<div class="legal-content">Response received.</div>';
}

function showTyping() {
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-wrapper bot';
  wrapper.id = 'typing-indicator';
  wrapper.innerHTML = `<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatArea.appendChild(wrapper);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendText() {
  const query = textInput.value.trim();
  if (!query) return;

  addMessage(query, 'user');
  textInput.value = '';
  sendBtn.disabled = true;
  showTyping();

  try {
    const formData = new FormData();
    formData.append('query', query);

    const res = await fetch('/api/web_chat', { method: 'POST', body: formData });
    const data = await res.json();
    hideTyping();

    if (data.status === 'success') {
      addMessage('', 'bot', false, null);
      // Replace last bubble with formatted if we have structured data
      const lastBubble = chatArea.querySelector('.msg-wrapper.bot:last-child .bubble');
      if (lastBubble) lastBubble.textContent = data.reply;
    } else {
      addMessage(data.message || 'Error occurred.', 'bot');
    }
  } catch (e) {
    hideTyping();
    addMessage('Connection error. Is the server running?', 'bot');
  }
  sendBtn.disabled = false;
}

// Voice recording
micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('mouseup', stopRecording);
micBtn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
micBtn.addEventListener('touchend', e => { e.preventDefault(); stopRecording(); });

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.title = 'Release to send';
  } catch(e) {
    addMessage('Microphone access denied.', 'bot');
  }
}

async function stopRecording() {
  if (!mediaRecorder || !isRecording) return;
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.title = 'Hold to record voice note';

  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t => t.stop());

  mediaRecorder.onstop = async () => {
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    if (blob.size < 1000) return;

    addMessage('🎤 Voice note', 'user');
    showTyping();

    const formData = new FormData();
    formData.append('audio', blob, 'voice.webm');

    try {
      const res = await fetch('/api/web_chat', { method: 'POST', body: formData });
      const data = await res.json();
      hideTyping();

      if (data.transcribed_query) {
        addMessage(`Transcribed: "${data.transcribed_query}"`, 'bot');
      }
      addMessage(data.reply || data.message || 'Error.', 'bot');
    } catch(e) {
      hideTyping();
      addMessage('Voice processing error.', 'bot');
    }
  };
}

// Send on Enter (Shift+Enter for newline)
textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});
sendBtn.addEventListener('click', sendText);

// Auto-resize textarea
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
